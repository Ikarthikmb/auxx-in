<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Auxx In</title>
<meta name="description" content="Auxx In: share a song and it plays next. Now playing, lyrics, queue, library, YouTube search, downloads.">
<meta name="apple-mobile-web-app-capable" content="yes">

<script>/* theme before the page draws (Settings → Theme, this device only) */
try{var t=localStorage.getItem('auxx-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<main><div class="view" id="view"></div></main>

<div class="mini" id="mini">
  <div class="cv" id="miniCover"></div>
  <div class="tx" id="miniText"><div class="t" id="miniTitle">…</div><div class="s" id="miniSub"></div></div>
  <button class="icon ghost" id="miniListen" type="button" aria-label="Listen here">▶</button>
  <button class="icon ghost" id="miniSkip" type="button" aria-label="Skip"><svg class="ico" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="16.9" y="5" width="2.6" height="14" rx="1.2"/><path d="M4.5 6.3v11.4a1 1 0 0 0 1.56.83l8.4-5.7a1 1 0 0 0 0-1.66l-8.4-5.7A1 1 0 0 0 4.5 6.3z"/></svg></button>
  <div class="bar" id="miniBar"></div>
</div>

<nav class="tabbar" aria-label="Sections">
  <a href="#now" data-tab="now"><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="2.6"/></svg></span>Now<span class="badge" data-qcount hidden></span></a>
  <a href="#search" data-tab="search"><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg></span>Search</a>
  <a href="#library" data-tab="library"><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4.5v15M8.5 4.5v15"/><path d="M13 5.2l3.8-1 4 15.3-3.8 1z"/></svg></span>Library</a>
  <a href="#downloads" data-tab="downloads"><span class="ic"><svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7.5 10.5L12 15l4.5-4.5"/><path d="M5 19.5h14"/></svg></span>Downloads<span class="badge warn" data-dcount hidden></span></a>
